services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: realtime_operations
      POSTGRES_USER: operations
      POSTGRES_PASSWORD: operations
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operations -d realtime_operations"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/realtime_operations
      DATABASE_USERNAME: operations
      DATABASE_PASSWORD: operations
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
  frontend:
    build: ./frontend
    ports: ["5408:80"]
    depends_on: [api]
volumes:
  postgres-data:
